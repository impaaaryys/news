<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SUN SHINE - Детективный Портал</title>
    <style>
        body {
            background-color: #0b0c0d;
            color: #d1c7bd;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        /* Вечный процедурный CSS-дождь без единой строчки JS */
        .rain-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 3px 120px;
            z-index: 1;
            pointer-events: none;
            animation: css-rain 0.8s linear infinite;
        }
        @keyframes css-rain {
            0% { background-position: 0px 0px; }
            100% { background-position: 20px 600px; }
        }
        .lamp-light {
            position: fixed;
            top: 0; left: 50%; width: 120vw; height: 120vh;
            background: radial-gradient(circle, rgba(255, 190, 110, 0.07) 0%, rgba(0,0,0,0) 70%);
            transform: translateX(-50%); z-index: 2; pointer-events: none;
        }
        .audio-control-panel {
            position: fixed;
            bottom: 25px; right: 25px; background: #141210;
            border: 1px solid #42352b; padding: 12px; border-radius: 2px;
            z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .audio-title { font-family: 'Courier New', monospace; font-size: 11px; color: #8c7664; font-weight: bold; }
        .newspaper-container {
            width: 100%; max-width: 850px; background: #e3dac9; color: #1c1a17; border: 1px solid #2b2520; padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 80px rgba(255, 190, 110, 0.1); position: relative; z-index: 10;
        }
        .theme-modern .header-main { background: #b0233a; color: #fff; }
        .theme-modern .sub-header { border-color: #1c1a17; color: #3b352e; }
        .theme-modern .article-headline { background: #262320; color: #e3dac9; }
        .theme-modern .article-photo-box { background: #d4caa8; border-color: #262320; }
        .theme-vintage { background: #cfc2aa !important; }
        .theme-vintage .header-main { background: #382c21 !important; color: #cfc2aa !important; font-family: 'Times New Roman', serif !important; font-style: italic; }
        .theme-vintage .sub-header { border-color: #382c21 !important; color: #4a3b2c; }
        .theme-vintage .article-headline { background: #4a3b2c !important; color: #cfc2aa !important; }
    </style>
</head>
<style>
        .header-main { text-align: center; padding: 20px 10px; font-family: 'Impact', Arial, sans-serif; font-size: 50px; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 5px; }
        .sub-header { display: flex; justify-content: space-between; border-top: 2px solid #1c1a17; border-bottom: 2px solid #1c1a17; padding: 8px 5px; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 30px; font-family: 'Arial', sans-serif; }
        .editor-box { background: rgba(0, 0, 0, 0.04); border: 1px dashed #4a3b2c; padding: 15px; margin-bottom: 30px; }
        .editor-title { color: #262320; font-weight: bold; margin-bottom: 12px; font-size: 13px; font-family: 'Arial', sans-serif; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 10px; background: #eae3d5; border: 1px solid #9c9181; color: #1c1a17; font-family: 'Georgia', serif; box-sizing: border-box; }
        .btn { background: #262320; color: #e3dac9; border: 1px solid #1c1a17; padding: 8px 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-family: 'Arial', sans-serif; font-size: 12px; }
        .btn:hover { background: #b0233a; color: #fff; }
        .audio-btn { background: #2b2520; color: #d1c7bd; border: 1px solid #4a3b32; padding: 6px 12px; font-weight: bold; cursor: pointer; font-size: 11px; font-family: 'Courier New', monospace; }
        .news-feed { display: flex; flex-direction: column; gap: 35px; }
        .article { border-bottom: 1px solid rgba(28, 26, 23, 0.2); padding-bottom: 30px; position: relative; }
        .article-headline { font-family: 'Impact', Arial, sans-serif; font-size: 24px; text-transform: uppercase; padding: 6px 12px; margin: 0 0 15px 0; letter-spacing: 1px; }
        .article-body { display: flex; gap: 25px; }
        .article-photo-box { width: 150px; min-width: 150px; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.2); }
        .article-img { width: 100%; height: 140px; object-fit: cover; border: 1px solid rgba(0,0,0,0.1); cursor: zoom-in; }
        .article-text-container { font-size: 15px; line-height: 1.6; text-align: justify; flex: 1; }
        .delete-btn { display: none; position: absolute; right: 0; bottom: 5px; background: #b0233a; color: #fff; border: none; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: 'Arial', sans-serif; text-transform: uppercase; font-weight: bold; }
        .admin-trigger { color: rgba(255,255,255,0.15); font-size: 11px; cursor: pointer; margin-top: 50px; text-align: center; width: 100%; }
        .image-viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 10, 0.95); z-index: 10000; justify-content: center; align-items: center; cursor: zoom-out; opacity: 0; }
        .image-viewer-modal.active { display: flex; opacity: 1; }
        .modal-img { max-width: 90%; max-height: 85%; border: 2px solid #4a3b32; box-shadow: 0 0 30px rgba(0,0,0,0.8); object-fit: contain; }
        .modal-caption { position: absolute; bottom: 40px; color: #8c7664; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
<div class="rain-overlay"></div>
<div class="lamp-light"></div>

<div class="image-viewer-modal" id="img-modal" onclick="closeImageViewer()">
    <img class="modal-img" id="modal-target-img" src="" alt="Улика">
    <div class="modal-caption">[ КЛИКНИТЕ ДЛЯ ЗАКРЫТИЯ ОКНА ]</div>
</div>

<div class="audio-control-panel">
    <div class="audio-title">DECT_AUDIO_GENERATOR</div>
    <audio id="ambient-sound" loop src="https://mixkit.co"></audio>
    <button class="audio-btn" onclick="playAudio()">[ СИНХРОНИЗИРОВАТЬ ЗВУК ]</button>
</div>
<div class="newspaper-container theme-modern" id="paper">
    <div class="header-main" id="paper-logo">THE SUN SHINE</div>
    <div class="sub-header">
        <div>КРИМИНАЛЬНАЯ ХРОНИКА ГОРОДА</div>
        <div id="live-date">ДАТА: 20.09.2026</div>
        <div id="paper-style-title">ВЕЧЕРНИЙ ВЫПУСК</div>
    </div>

    <div class="editor-box">
        <div class="editor-title">Архив прессы и публикация</div>
        <div style="margin-bottom: 12px;">
            <select id="theme-selector" onchange="changePaperTheme()">
                <option value="modern">Реалистичная газета (The Sun Shine)</option>
                <option value="vintage">Ретро архив дел (Olden Times)</option>
            </select>
        </div>
        <input type="text" id="input-title" placeholder="ЗАГОЛОВОК СТАТЬИ / РАССПЛЕДОВАНИЯ...">
        <input type="text" id="input-img" placeholder="Ссылка на фото скриншота (оставь пустым для стандартного фоторобота)...">
        <textarea id="input-text" placeholder="Введите текст детективной хроники..."></textarea>
        <button class="btn" onclick="createNewArticle()">Пустить в тираж</button>
    </div>

    <div class="news-feed" id="news-container">
        <!-- Лента рапортов -->
    </div>
</div>

<div class="admin-trigger" onclick="activateAdminMode()">[ ТЕХНИЧЕСКИЙ ДОСТУП РЕДАКТОРА ДЛЯ МОДЕРАЦИИ ]</div>

<script>
    const now = new Date();
    document.getElementById('live-date').textContent = "ДАТА: " + now.toLocaleDateString('ru-RU', { year: 'numeric', month: '2-digit', day: '2-digit' });

    let savedArticles = JSON.parse(localStorage.getItem('real_news_articles')) || [];
    let isAdmin = false; const adminPin = "7777";

    let isPlaying = false;
    function playAudio() {
        const audio = document.getElementById('ambient-sound');
        if (!isPlaying) { audio.play(); isPlaying = true; alert("Звук дождя запущен."); } 
        else { audio.pause(); isPlaying = false; }
    }

    function openImageViewer(element, isSvg = false) {
        const modal = document.getElementById('img-modal'); const modalImg = document.getElementById('modal-target-img');
        if (isSvg) { modalImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='200' height='250' viewBox='0 0 100 100' style='fill:%2324211e;'><circle cx='50' cy='35' r='20'/><path d='M50 60 C20 60 10 90 10 100 L90 100 C90 90 80 60 50 60 Z'/></svg>"; } 
        else { modalImg.src = element.src; }
        modal.classList.add('active');
    }

    function closeImageViewer() { document.getElementById('img-modal').classList.remove('active'); }

    function changePaperTheme() {
        const selector = document.getElementById('theme-selector'); const paper = document.getElementById('paper'); const logo = document.getElementById('paper-logo'); const styleTitle = document.getElementById('paper-style-title');
        if (selector.value === 'vintage') {
            paper.className = 'newspaper-container theme-vintage'; logo.textContent = 'Olden Times'; styleTitle.textContent = 'АРХИВНЫЙ ДОКУМЕНТ';
        } else {
            paper.className = 'newspaper-container theme-modern'; logo.textContent = 'THE SUN SHINE'; styleTitle.textContent = 'ВЕЧЕРНИЙ ВЫПУСК';
        }
    }

    function activateAdminMode() {
        if (prompt("Код:") === adminPin) { isAdmin = true; alert("Админка включена."); document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'block'); }
    }

    function renderSavedArticles() {
        const container = document.getElementById('news-container'); container.innerHTML = '';
        if (savedArticles.length === 0) {
            const defaultArt = createArticleHTML("МАНЬЯК ПРОДОЛЖАЕТ ИГРУ С ПОЛИЦИЕЙ", "Загадочные послания в почтовых ящиках заставили детективный отдел работать в удвоенном режиме. Преступник оставляет странные знаки, отсылающие к древним трактатам о грехах. Горожанам рекомендуется закрывать двери и сообщать прессе о любых подозрительных личностях у терминалов. Наш специальный портал внимательно следит за ходом следствия.", "", 0);
            container.appendChild(defaultArt);
        }
        savedArticles.forEach((art, index) => { container.insertBefore(createArticleHTML(art.title, art.text, art.img, index), container.firstChild); });
        if (isAdmin) document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'block');
    }

    function createNewArticle() {
        const title = document.getElementById('input-title'); const text = document.getElementById('input-text'); const img = document.getElementById('input-img');
        if (!title.value.trim() || !text.value.trim()) return alert("Заполните поля!");
        const newArt = { title: title.value, text: text.value, img: img.value };
        savedArticles.push(newArt); localStorage.setItem('real_news_articles', JSON.stringify(savedArticles));
        renderSavedArticles(); title.value = ''; text.value = ''; img.value = '';
    }

    function createArticleHTML(title, text, imgUrl, index) {
        const articleDiv = document.createElement('div'); articleDiv.className = 'article'; articleDiv.id = 'article-' + index;
        let imgHTML = `<svg width="110" height="140" viewBox="0 0 100 100" style="fill:#24211e; cursor:pointer;" onclick="openImageViewer(this, true)"><circle cx="50" cy="35" r="20"/><path d="M50 60 C20 60 10 90 10 100 L90 100 C90 90 80 60 50 60 Z"/></svg><div style="font-size:10px; color:#4a4135; text-align:center; margin-top:5px; font-family:sans-serif; font-weight:bold;">УЛИКА</div>`;
        if (imgUrl && imgUrl.trim() !== '') { imgHTML = `<img src="${imgUrl}" class="article-img" onclick="openImageViewer(this, false)" onerror="this.parentNode.innerHTML=this.parentNode.dataset.fallback;">`; }
        articleDiv.innerHTML = `<h2 class="article-headline">${title}</h2><div class="article-body"><div class="article-photo-box" data-fallback='<svg width="110" height="140" viewBox="0 0 100 100" style="fill:#24211e; cursor:pointer;" onclick="openImageViewer(this, true)"><circle cx="50" cy="35" r="20"/><path d="M50 60 C20 60 10 90 10 100 L90 100 C90 90 80 60 50 60 Z"/></svg><div style="font-size:10px; color:#4a4135; text-align:center; margin-top:5px; font-family:sans-serif; font-weight:bold;">УЛИКА</div>'>${imgHTML}</div><div class="article-text-container">${text}</div></div><button class="delete-btn" onclick="deleteArticle(${index})">Стереть из архива</button>`;
        return articleDiv;
    }

    function deleteArticle(index) {
        if(confirm("Удалить?")) { savedArticles.splice(index, 1); localStorage.setItem('real_news_articles', JSON.stringify(savedArticles)); location.reload(); }
    }
    renderSavedArticles();
</script>
</body>
</html>
