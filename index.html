<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SUN SHINE - Детективный Портал</title>
    <style>
        /* Мрачный фон сырой детективной комнаты */
        body {
            background-color: #050608;
            background-image: radial-gradient(circle at center, rgba(20, 24, 30, 0.2) 0%, rgba(3, 4, 5, 0.9) 100%);
            color: #bfae9e;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        /* Крупный, заметный процедурный CSS-дождь */
        .rain-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255,255,255,0.06) 2px, transparent 2px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 8px 240px;
            z-index: 1;
            pointer-events: none;
            animation: css-rain 0.6s linear infinite;
            filter: blur(0.5px);
        }
        @keyframes css-rain {
            0% { background-position: 0px 0px; }
            100% { background-position: 40px 1200px; }
        }
        /* Тусклый, давящий свет настольной лампы */
        .lamp-light {
            position: fixed;
            top: 0; left: 50%; width: 140vw; height: 140vh;
            background: radial-gradient(circle at 50% 20%, rgba(212, 163, 115, 0.12) 0%, rgba(0,0,0,0) 65%);
            transform: translateX(-50%); z-index: 2; pointer-events: none;
        }
        .audio-control-panel {
            position: fixed;
            bottom: 25px; right: 25px; background: #0f1112;
            border: 1px solid #332a21; padding: 12px; border-radius: 0;
            z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        .audio-title { font-family: monospace; font-size: 11px; color: #736152; font-weight: bold; }
        
        /* Атмосферная текстурированная газета с эффектом старины и обгоревшим градиентом */
        .newspaper-container {
            width: 100%; max-width: 850px; 
            background-color: #d1c4b2;
            background-image: radial-gradient(circle at center, #ebdcc7 0%, #c4b5a1 100%);
            color: #12100e; 
            border: 1px solid #241f19; padding: 40px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 
                        inset 0 0 60px rgba(0,0,0,0.15),
                        inset 0 0 120px rgba(74, 51, 33, 0.2); 
            position: relative; z-index: 10;
        }
    </style>
</head>
<style>
        .theme-modern .header-main { background: #801a21; color: #ebdca5; border-bottom: 3px double #12100e; border-top: 3px double #12100e; }
        .theme-modern .sub-header { border-color: #12100e; color: #211c16; font-family: 'Courier New', monospace; font-get: bold; }
        .theme-modern .article-headline { background: #1a1816; color: #ebdcc7; font-family: 'Impact', sans-serif; letter-spacing: 2px; }
        .theme-modern .article-photo-box { background: #b8ab96; border: 1px solid #12100e; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        
        .theme-vintage { background-color: #baa890 !important; background-image: radial-gradient(circle at center, #c7b69d 0%, #aa9980 100%) !important; }
        .theme-vintage .header-main { background: #2b1f14 !important; color: #baa890 !important; font-family: 'Times New Roman', serif !important; font-style: italic; }
        .theme-vintage .sub-header { border-color: #2b1f14 !important; color: #36281b; }
        .theme-vintage .article-headline { background: #36281b !important; color: #baa890 !important; }

        .header-main { text-align: center; padding: 20px 10px; font-size: 48px; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        .sub-header { display: flex; justify-content: space-between; border-top: 2px solid #12100e; border-bottom: 2px solid #12100e; padding: 8px 5px; font-size: 12px; text-transform: uppercase; margin-bottom: 35px; }
        
        /* Панель маскируется под старое личное дело уголовного розыска */
        .editor-box { background: rgba(0, 0, 0, 0.05); border: 1px solid #4a3c2c; padding: 20px; margin-bottom: 35px; box-shadow: inset 0 0 15px rgba(0,0,0,0.05); }
        .editor-title { color: #12100e; font-weight: bold; margin-bottom: 12px; font-size: 14px; text-transform: uppercase; border-bottom: 1px dashed #4a3c2c; padding-bottom: 5px; }
        
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 12px; background: rgba(240, 230, 214, 0.7); border: 1px solid #7a6b58; color: #12100e; font-family: 'Courier New', monospace; font-weight: bold; box-sizing: border-box; }
        input:focus, textarea:focus { background: #fff; outline: 1px solid #12100e; }
        
        .btn { background: #1a1816; color: #ebdcc7; border: 1px solid #12100e; padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .btn:hover { background: #801a21; color: #fff; }
        .audio-btn { background: #1f1a14; color: #bfae9e; border: 1px solid #42352b; padding: 6px 12px; font-weight: bold; cursor: pointer; font-size: 11px; font-family: monospace; }
        .audio-btn:hover { background: #332a21; color: #fff; }
        
        .news-feed { display: flex; flex-direction: column; gap: 40px; }
        .article { border-bottom: 1px dashed rgba(18, 16, 14, 0.3); padding-bottom: 35px; position: relative; }
        .article-headline { font-size: 22px; text-transform: uppercase; padding: 8px 15px; margin: 0 0 18px 0; }
        .article-body { display: flex; gap: 25px; }
        .article-photo-box { width: 150px; min-width: 150px; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; }
        .article-img { width: 100%; height: 140px; object-fit: cover; border: 1px solid rgba(0,0,0,0.1); cursor: zoom-in; }
        .article-text-container { font-size: 14px; line-height: 1.6; text-align: justify; flex: 1; font-family: 'Courier New', monospace; font-weight: bold; }
        .delete-btn { display: none; position: absolute; right: 0; bottom: 5px; background: #801a21; color: #fff; border: none; padding: 4px 10px; font-size: 11px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .admin-trigger { color: rgba(255,255,255,0.08); font-size: 11px; cursor: pointer; margin-top: 50px; text-align: center; width: 100%; }
        .image-viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 4, 5, 0.97); z-index: 10000; justify-content: center; align-items: center; cursor: zoom-out; opacity: 0; }
        .image-viewer-modal.active { display: flex; opacity: 1; }
        .modal-img { max-width: 90%; max-height: 85%; border: 3px solid #332a21; box-shadow: 0 0 40px rgba(0,0,0,0.9); }
        .modal-caption { position: absolute; bottom: 40px; color: #736152; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
<div class="rain-overlay"></div>
<div class="lamp-light"></div>

<div class="image-viewer-modal" id="img-modal" onclick="closeImageViewer()">
    <img class="modal-img" id="modal-target-img" src="" alt="Улика">
    <div class="modal-caption">[ НАЖМИТЕ ДЛЯ ЗАКРЫТИЯ ОКНА ]</div>
</div>

<div class="audio-control-panel">
    <div class="audio-title">DECT_AUDIO_LOG</div>
    <audio id="ambient-sound" loop src="https://mixkit.co"></audio>
    <button class="audio-btn" onclick="playAudio()">[ СИНХРОНИЗИРОВАТЬ ЗВУК ]</button>
</div>

<div class="newspaper-container theme-modern" id="paper">
    <div class="header-main" id="paper-logo">THE SUN SHINE</div>
    <div class="sub-header">
        <div>СВОДКА КРИМИНАЛЬНЫХ ДЕЛ УГРО</div>
        <div id="live-date">ДАТА: 20.09.2026</div>
        <div id="paper-style-title">ВЕЧЕРНИЙ ТИРАЖ</div>
    </div>

    <div class="editor-box">
        <div class="editor-title">ДОСЬЕ ПУБЛИКАЦИИ / РАПОРТ</div>
        <div style="margin-bottom: 12px;">
            <select id="theme-selector" onchange="changePaperTheme()">
                <option value="modern">Газетный разворот (The Sun Shine)</option>
                <option value="vintage">Архивная папка КГБ (Olden Times)</option>
            </select>
        </div>
        <input type="text" id="input-title" placeholder="ГРОМКОЕ НАЗВАНИЕ ДЕЛА / СТАТЬИ...">
        <input type="text" id="input-img" placeholder="Ссылка на фото скриншота с сервера (если пусто - будет силуэт)...">
        <textarea id="input-text" placeholder="Запишите сюда показания свидетелей, улики или городские слухи..."></textarea>
        <button class="btn" onclick="createNewArticle()">Внести в номер</button>
    </div>

    <div class="news-feed" id="news-container">
        <!-- Сюда вставляются рапорты -->
    </div>
</div>

<div class="admin-trigger" onclick="activateAdminMode()">[ СЛУЖЕБНЫЙ ВХОД ДЛЯ МОДЕРАЦИИ ПРЕССЫ ]</div>

<script>
    const now = new Date();
    document.getElementById('live-date').textContent = "ДАТА: " + now.toLocaleDateString('ru-RU', { year: 'numeric', month: '2-digit', day: '2-digit' });
    let savedArticles = JSON.parse(localStorage.getItem('real_news_articles')) || [];
    let isAdmin = false; const adminPin = "7777";

    let isPlaying = false;
    function playAudio() {
        const audio = document.getElementById('ambient-sound');
        if (!isPlaying) { audio.play(); isPlaying = true; } 
        else { audio.pause(); isPlaying = false; }
    }

    function openImageViewer(element, isSvg = false) {
        const modal = document.getElementById('img-modal'); const modalImg = document.getElementById('modal-target-img');
        if (isSvg) { modalImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='200' height='250' viewBox='0 0 100 100' style='fill:%231a1816;'><circle cx='50' cy='35' r='20'/><path d='M50 60 C20 60 10 90 10 100 L90 100 C90 90 80 60 50 60 Z'/></svg>"; } 
        else { modalImg.src = element.src; }
        modal.classList.add('active');
    }

    function closeImageViewer() { document.getElementById('img-modal').classList.remove('active'); }

    function changePaperTheme() {
        const selector = document.getElementById('theme-selector'); const paper = document.getElementById('paper'); const logo = document.getElementById('paper-logo'); const styleTitle = document.getElementById('paper-style-title');
        if (selector.value === 'vintage') {
            paper.className = 'newspaper-container theme-vintage'; logo.textContent = 'Olden Times'; styleTitle.textContent = 'АРХИВНЫЙ ДОКУМЕНТ';
        } else {
            paper.className = 'newspaper-container theme-modern'; logo.textContent = 'THE SUN SHINE'; styleTitle.textContent = 'ВЕЧЕРНИЙ ТИРАЖ';
        }
    }

    function activateAdminMode() {
        if (prompt("СЛУЖЕБНЫЙ КОД:") === adminPin) { isAdmin = true; alert("Режим чистки включен."); document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'block'); }
    }

    function renderSavedArticles() {
        const container = document.getElementById('news-container'); container.innerHTML = '';
        if (savedArticles.length === 0) {
            const defaultArt = createArticleHTML("МАНЬЯК ПРОДОЛЖАЕТ ИГРУ С ПОЛИЦИЕЙ", "Загадочные послания в почтовых ящиках заставили детективный отдел работать в удвоенном режиме. Преступник оставляет странные знаки, отсылающие к древним трактатам о грехах. Горожанам рекомендуется закрывать двери и сообщать прессе о любых подозрительных личностях у терминалов. Наш специальный портал внимательно следит за ходом следствия.", "", 0);
            container.appendChild(defaultArt);
        }
        savedArticles.forEach((art, index) => { container.insertBefore(createArticleHTML(art.title, art.text, art.img, index), container.firstChild); });
        if (isAdmin) document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'block');
    }

    function createNewArticle() {
        const title = document.getElementById('input-title'); const text = document.getElementById('input-text'); const img = document.getElementById('input-img');
        if (!title.value.trim() || !text.value.trim()) return alert("Заполните рапорт полностью!");
        const newArt = { title: title.value, text: text.value, img: img.value };
        savedArticles.push(newArt); localStorage.setItem('real_news_articles', JSON.stringify(savedArticles));
        renderSavedArticles(); title.value = ''; text.value = ''; img.value = '';
    }

    function createArticleHTML(title, text, imgUrl, index) {
        const articleDiv = document.createElement('div'); articleDiv.className = 'article'; articleDiv.id = 'article-' + index;
        let imgHTML = `<svg width="110" height="140" viewBox="0 0 100 100" style="fill:#1a1816; cursor:pointer;" onclick="openImageViewer(this, true)"><circle cx="50" cy="35" r="20"/><path d="M50 60 C20 60 10 90 10 100 L90 100 C90 90 80 60 50 60 Z"/></svg><div style="font-size:10px; color:#3b332b; text-align:center; margin-top:5px; font-family:sans-serif; font-weight:bold;">УЛИКА</div>`;
        if (imgUrl && imgUrl.trim() !== '') { imgHTML = `<img src="${imgUrl}" class="article-img" onclick="openImageViewer(this, false)" onerror="this.parentNode.innerHTML=this.parentNode.dataset.fallback;">`; }
        articleDiv.innerHTML = `<h2 class="article-headline">${title}</h2><div class="article-body"><div class="article-photo-box" data-fallback='<svg width="110" height="140" viewBox="0 0 100 100" style="fill:#1a1816; cursor:pointer;" onclick="openImageViewer(this, true)"><circle cx="50" cy="35" r="20"/><path d="M50 60 C20 60 10 90 10 100 L90 100 C90 90 80 60 50 60 Z"/></svg><div style="font-size:10px; color:#3b332b; text-align:center; margin-top:5px; font-family:sans-serif; font-weight:bold;">УЛИКА</div>'>${imgHTML}</div><div class="article-text-container">${text}</div></div><button class="delete-btn" onclick="deleteArticle(${index})">Удалить из архива</button>`;
        return articleDiv;
    }

    function deleteArticle(index) {
        if(confirm("Удалить рапорт за НонРП?")) { savedArticles.splice(index, 1); localStorage.setItem('real_news_articles', JSON.stringify(savedArticles)); location.reload(); }
    }
    renderSavedArticles();
</script>
</body>
</html>
