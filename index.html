<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SUN SHINE - Детективный Портал</title>
    <style>
        /* Мрачный фон сырого детективного кабинета */
        body {
            background-color: #06080a;
            background-image: radial-gradient(circle at center, #0e1317 0%, #030405 100%);
            color: #b2a190;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Плотная папка газеты с текстурой пергамента и обгоревшим градиентом по краям */
        .newspaper-container {
            width: 100%;
            max-width: 850px; 
            background-color: #cbbeaa;
            background-image: radial-gradient(circle at center, #dfd0bb 20%, #b3a38f 100%);
            color: #14110e; 
            border: 2px solid #1f1a14;
            padding: 45px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 
                        0 0 40px rgba(0,0,0,0.4),
                        inset 0 0 100px rgba(54, 38, 25, 0.4); /* Эффект грязи и копоти по углам */
            position: relative;
            box-sizing: border-box;
        }
        
        .header-main { 
            text-align: center; 
            padding: 22px 10px; 
            font-size: 50px; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            font-weight: bold; 
            letter-spacing: 4px;
            background: #73181f; 
            color: #ebd4a8; 
            border-bottom: 4px double #14110e; 
            border-top: 4px double #14110e;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .sub-header { 
            display: flex; 
            justify-content: space-between; 
            border-top: 2px solid #14110e; 
            border-bottom: 2px solid #14110e; 
            padding: 10px 5px; 
            font-size: 12px; 
            text-transform: uppercase; 
            margin-bottom: 40px; 
            letter-spacing: 1px;
            color: #29221a;
            font-weight: bold;
        }
        
        /* Блок рапорта стилизован под грубый картон архивного дела */
        .editor-box { 
            background: rgba(0, 0, 0, 0.06); 
            border: 1px solid #3d3125; 
            padding: 20px; 
            margin-bottom: 40px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.08); 
        }
        
        .editor-title { 
            color: #14110e; 
            font-weight: bold; 
            margin-bottom: 15px; 
            font-size: 14px; 
            text-transform: uppercase; 
            border-bottom: 1px dashed #3d3125; 
            padding-bottom: 6px; 
            letter-spacing: 1px; 
        }
        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 12px; 
            background: rgba(227, 216, 197, 0.8); 
            border: 1px solid #6b5c4b; 
            color: #14110e; 
            font-family: 'Courier New', monospace; 
            font-weight: bold; 
            box-sizing: border-box; 
            font-size: 14px; 
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.1); 
        }
        input:focus, textarea:focus { background: #fff; outline: 1px solid #14110e; box-shadow: 0 0 8px rgba(0,0,0,0.1); }
        
        .btn { 
            background: #1a1714; 
            color: #dfd0bb; 
            border: 1px solid #14110e; 
            padding: 12px 25px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 12px; 
            letter-spacing: 1px; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.2); 
            transition: all 0.2s; 
        }
        .btn:hover { background: #73181f; color: #fff; box-shadow: 0 4px 12px rgba(115, 24, 31, 0.4); }
        
        .news-feed { display: flex; flex-direction: column; gap: 45px; }
        .article { border-bottom: 1px dashed rgba(20, 17, 14, 0.4); padding-bottom: 40px; position: relative; }
        .article-headline { 
            font-size: 24px; 
            text-transform: uppercase; 
            padding: 10px 18px; 
            margin: 0 0 20px 0; 
            background: #1a1714; 
            color: #dfd0bb; 
            font-family: 'Impact', sans-serif; 
            letter-spacing: 2px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .article-body { display: flex; gap: 25px; }
        
        .article-photo-box { 
            width: 150px; 
            min-width: 150px; 
            height: 185px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 8px; 
            box-sizing: border-box; 
            border: 1px solid #14110e; 
            background: #ad9e87; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }
        
        .article-img { width: 100%; height: 140px; object-fit: cover; border: 1px solid rgba(0,0,0,0.15); cursor: zoom-in; }
        .article-text-container { font-size: 14.5px; line-height: 1.65; text-align: justify; flex: 1; font-family: 'Courier New', monospace; font-weight: bold; color: #14110e; }
        .delete-btn { display: none; position: absolute; right: 0; bottom: 5px; background: #73181f; color: #fff; border: none; padding: 5px 12px; font-size: 11px; cursor: pointer; text-transform: uppercase; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .admin-trigger { color: rgba(255,255,255,0.06); font-size: 11px; cursor: pointer; margin-top: 50px; text-align: center; width: 100%; user-select: none; }
        
        .image-viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 4, 5, 0.98); z-index: 10000; justify-content: center; align-items: center; cursor: zoom-out; opacity: 0; }
        .image-viewer-modal.active { display: flex; opacity: 1; }
        .modal-img { max-width: 90%; max-height: 85%; border: 3px solid #241910; box-shadow: 0 0 50px rgba(0,0,0,0.95); }
        .modal-caption { position: absolute; bottom: 40px; color: #695244; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

<div class="image-viewer-modal" id="img-modal" onclick="closeImageViewer()">
    <img class="modal-img" id="modal-target-img" src="" alt="Улика">
    <div class="modal-caption">[ НАЖМИТЕ ДЛЯ ЗАКРЫТИЯ ОКНА ]</div>
</div>

<div class="newspaper-container" id="paper">
    <div class="header-main" id="paper-logo">THE SUN SHINE</div>
    <div class="sub-header">
        <div>СВОДКА КРИМИНАЛЬНЫХ ДЕЛ УГРО</div>
        <div id="live-date">ДАТА: 21.09.2026</div>
        <div id="paper-style-title">ВЕЧЕРНИЙ ТИРАЖ</div>
    </div>

    <div class="editor-box">
        <div class="editor-title">ДОСЬЕ ПУБЛИКАЦИИ / РАПОРТ ДЕТЕКТИВА</div>
        <input type="text" id="input-title" placeholder="ГРОМКОЕ НАЗВАНИЕ ДЕЛА / СТАТЬИ...">
        <input type="text" id="input-img" placeholder="Ссылка на скриншот улики с сервера (если пусто - будет силуэт)...">
        <textarea id="input-text" placeholder="Запишите сюда показания свидетелей, хронологию преступления или слухи..."></textarea>
        <button class="btn" onclick="createNewArticle()">Внести в номер</button>
    </div>

    <div class="news-feed" id="news-container">
        <!-- Рапорты -->
    </div>
</div>

<div class="admin-trigger" onclick="activateAdminMode()">[ СЛУЖЕБНЫЙ ВХОД ДЛЯ МОДЕРАЦИИ ПРЕССЫ ]</div>

<script>
    const now = new Date();
    document.getElementById('live-date').textContent = "ДАТА: " + now.toLocaleDateString('ru-RU', { year: 'numeric', month: '2-digit', day: '2-digit' });
    let savedArticles = JSON.parse(localStorage.getItem('real_news_articles')) || [];
    let isAdmin = false; const adminPin = "7777";

    function openImageViewer(element, isSvg = false) {
        const modal = document.getElementById('img-modal'); const modalImg = document.getElementById('modal-target-img');
        if (isSvg) { modalImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='200' height='250' viewBox='0 0 100 100' style='fill:%231a1714;'><circle cx='50' cy='35' r='20'/><path d='M50 60 C20 60 10 90 10 100 L90 100 C90 90 80 60 50 60 Z'/></svg>"; } 
        else { modalImg.src = element.src; }
        modal.classList.add('active');
    }

    function closeImageViewer() { document.getElementById('img-modal').classList.remove('active'); }

    function activateAdminMode() {
        if (prompt("СЛУЖЕБНЫЙ КОД:") === adminPin) { isAdmin = true; alert("Режим чистки включен."); document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'block'); }
    }

    function renderSavedArticles() {
        const container = document.getElementById('news-container'); container.innerHTML = '';
        if (savedArticles.length === 0) {
            const defaultArt = createArticleHTML("МАНЬЯК ПРОДОЛЖАЕТ ИГРУ С ПОЛИЦИЕЙ", "Загадочные послания в почтовых ящиках заставили детективный отдел работать в удвоенном режиме. Преступник оставляет странные знаки, отсылающие к древним трактатам о грехах. Горожанам рекомендуется закрывать двери и сообщать прессе о любых подозрительных личностях у терминалов. Наш специальный портал внимательно следит за ходом следствия.", "", 0);
            container.appendChild(defaultArt);
        }
        savedArticles.forEach((art, index) => { container.insertBefore(createArticleHTML(art.title, art.text, art.img, index), container.firstChild); });
        if (isAdmin) document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'block');
    }

    function createNewArticle() {
        const title = document.getElementById('input-title'); const text = document.getElementById('input-text'); const img = document.getElementById('input-img');
        if (!title.value.trim() || !text.value.trim()) return alert("Заполните рапорт полностью!");
        const newArt = { title: title.value, text: text.value, img: img.value };
        savedArticles.push(newArt); localStorage.setItem('real_news_articles', JSON.stringify(savedArticles));
        renderSavedArticles(); title.value = ''; text.value = ''; img.value = '';
    }

    function createArticleHTML(title, text, imgUrl, index) {
        const articleDiv = document.createElement('div'); articleDiv.className = 'article'; articleDiv.id = 'article-' + index;
        let imgHTML = `<svg width="110" height="140" viewBox="0 0 100 100" style="fill:#1a1714; cursor:pointer;" onclick="openImageViewer(this, true)"><circle cx="50" cy="35" r="20"/><path d="M50 60 C20 60 10 90 10 100 L90 100 C90 90 80 60 50 60 Z"/></svg><div style="font-size:10px; color:#3d3125; text-align:center; margin-top:5px; font-family:sans-serif; font-weight:bold;">УЛИКА</div>`;
        if (imgUrl && imgUrl.trim() !== '') { imgHTML = `<img src="${imgUrl}" class="article-img" onclick="openImageViewer(this, false)" onerror="this.parentNode.innerHTML=this.parentNode.dataset.fallback;">`; }
        articleDiv.innerHTML = `<h2 class="article-headline">${title}</h2><div class="article-body"><div class="article-photo-box" data-fallback='<svg width="110" height="140" viewBox="0 0 100 100" style="fill:#1a1714; cursor:pointer;" onclick="openImageViewer(this, true)"><circle cx="50" cy="35" r="20"/><path d="M50 60 C20 60 10 90 10 100 L90 100 C90 90 80 60 50 60 Z"/></svg><div style="font-size:10px; color:#3d3125; text-align:center; margin-top:5px; font-family:sans-serif; font-weight:bold;">УЛИКА</div>'>${imgHTML}</div><div class="article-text-container">${text}</div></div><button class="delete-btn" onclick="deleteArticle(${index})">Стереть из архива</button>`;
        return articleDiv;
    }

    function deleteArticle(index) {
        if(confirm("Удалить рапорт?")) { savedArticles.splice(index, 1); localStorage.setItem('real_news_articles', JSON.stringify(savedArticles)); location.reload(); }
    }
    renderSavedArticles();
</script>
</body>
</html>
